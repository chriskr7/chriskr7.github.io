<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="800" height="330" rx="12" fill="#1f2430"/>
  <text x="32" y="44" fill="#eef1f5" font-size="20" font-weight="700">고용주가 꼽은 핵심 역량 (WEF 「2025 일자리의 미래」)</text>
  <text x="32" y="70" fill="#9aa4b2" font-size="13">핵심 역량으로 꼽은 고용주 비율 · 55개국 1,000여 개 고용주 응답</text>
  <g font-size="15" fill="#d8dde5">
    <text x="32" y="122">분석적 사고</text>
    <rect x="230" y="104" width="358.8" height="26" rx="4" fill="#6fd3e0"/>
    <text x="598" y="122" font-weight="700" fill="#eef1f5">69%</text>
    <text x="32" y="172">회복탄력성·유연성</text>
    <rect x="230" y="154" width="348.4" height="26" rx="4" fill="#6fd3e0"/>
    <text x="588" y="172" font-weight="700" fill="#eef1f5">67%</text>
    <text x="32" y="222">리더십·사회적 영향력</text>
    <rect x="230" y="204" width="317.2" height="26" rx="4" fill="#6fd3e0"/>
    <text x="557" y="222" font-weight="700" fill="#eef1f5">61%</text>
    <text x="32" y="272">프로그래밍</text>
    <rect x="230" y="254" width="88.4" height="26" rx="4" fill="#e8a84a"/>
    <text x="328" y="272" font-weight="700" fill="#eef1f5">17%</text>
  </g>
  <text x="768" y="314" fill="#6b7482" font-size="11" text-anchor="end">출처: World Economic Forum, Future of Jobs Report 2025</text>
</svg>
